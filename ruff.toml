# Настройки ruff для Swept.
#
# Правила выбраны по принципу «ловит настоящие ошибки, но не устраивает
# споры о стиле»: синтаксис, неопределённые имена, неиспользуемые импорты,
# типичные баги из flake8-bugbear. Форматирование не навязывается.

line-length = 100
target-version = "py310"

exclude = [
    ".build",
    ".git",
    ".ruff_cache",
    "__pycache__",
    "_archive",
    "_nuitka_trash",
    "build",
    "dist",
    "dist-nuitka",
    "installer",
]

[lint]
select = [
    "E4",   # импорты: порядок внутри строки
    "E7",   # устаревшие конструкции
    "E9",   # синтаксис и рантайм-ошибки
    "F",    # pyflakes: неопределённые имена, неиспользуемые импорты
    "W",    # пробелы и переводы строк
    "B",    # flake8-bugbear: типичные логические ошибки
]

[lint.per-file-ignores]
# В тестах assert — это и есть проверка, а не отладочный код.
"tests/*" = ["B011"]
